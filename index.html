<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramkalyan | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="starfield" aria-hidden="true">
      <span class="star star-a"></span>
      <span class="star star-b"></span>
      <span class="star star-c"></span>
      <span class="star star-d"></span>
      <span class="star star-e"></span>
      <span class="star star-f"></span>
      <span class="star star-g"></span>
      <span class="star star-h"></span>
    </div>
    <div class="page-shell">
      <main class="page">
        <section class="hero reveal active">
          <h1 id="hero-name"></h1>
          <p class="hero-description" id="hero-description"></p>
        </section>

        <section class="content-section reveal" id="experience">
          <h2><i class="fa-solid fa-briefcase"></i> Experience</h2>
          <div id="experience-list" class="list-block"></div>
        </section>

        <section class="content-section reveal" id="projects">
          <h2><i class="fa-solid fa-sparkles"></i> Projects</h2>
          <div id="projects-list" class="project-list"></div>
        </section>

        <section class="content-section reveal" id="education">
          <h2><i class="fa-solid fa-graduation-cap"></i> Education</h2>
          <div id="education-list" class="list-block"></div>
        </section>

        <section class="content-section reveal" id="skills">
          <h2><i class="fa-solid fa-code"></i> Stack</h2>
          <div id="skills-list" class="skills-list"></div>
        </section>

      </main>
    </div>

    <nav class="dock" aria-label="Social links">
      <a id="dock-resume" href="#" target="_blank" rel="noreferrer" title="Resume"
        ><i class="fa-regular fa-file-lines"></i
      ></a>
      <a id="dock-github" href="#" target="_blank" rel="noreferrer" title="GitHub"
        ><i class="fab fa-github"></i
      ></a>
      <a
        id="dock-linkedin"
        href="#"
        target="_blank"
        rel="noreferrer"
        title="LinkedIn"
        ><i class="fab fa-linkedin"></i
      ></a>
      <a id="dock-x" href="#" target="_blank" rel="noreferrer" title="X">
        <span class="x-mark">X</span>
      </a>
      <a id="dock-email" href="#" title="Email"><i class="fa-regular fa-envelope"></i></a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
